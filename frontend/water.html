<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water quality - HealthHarbor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="nav"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>Water quality</h1>
        <p>Water supply observations, sanitation-related issues, and the corrective action taken for each.</p>
      </div>
      <div class="head-actions">
        <button class="btn primary" onclick="addRecord()">Record an observation</button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-body">
        <div class="toolbar" style="margin-bottom:0">
          <select id="villageFilter" onchange="render()" aria-label="Filter by village"></select>
          <label class="check" style="margin:0">
            <input type="checkbox" id="pendingOnly" onchange="load()"> Show only issues still waiting for action
          </label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Village and source</th><th>Quality</th><th class="num">pH</th>
              <th>Observation</th><th>Issue and action</th><th>Action status</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<dialog id="waterDlg">
  <form id="waterForm" onsubmit="saveRecord(event)">
    <div class="dlg-head">
      <h3>Record an observation</h3>
      <button type="button" class="dlg-close" onclick="closeDlg('waterDlg')" aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
      <div class="form-grid">
        <div>
          <label for="w_village">Village</label>
          <input id="w_village" name="village" required>
        </div>
        <div>
          <label for="w_source">Water source</label>
          <select id="w_source" name="source">
            <option>Handpump</option>
            <option>Well</option>
            <option>Borewell</option>
            <option>Water tank</option>
            <option>Pipeline</option>
          </select>
        </div>
        <div>
          <label for="w_quality">Quality</label>
          <select id="w_quality" name="qualityStatus" required>
            <option value="SAFE">Safe</option>
            <option value="UNSAFE">Unsafe</option>
          </select>
        </div>
        <div>
          <label for="w_ph">pH value</label>
          <input id="w_ph" name="phValue" type="number" step="0.1" min="0" max="14">
        </div>
        <div class="full">
          <label for="w_obs">What was observed?</label>
          <input id="w_obs" name="observation" placeholder="Colour, smell, taste, anything unusual">
        </div>
        <div class="full">
          <label for="w_issue">Issue found (leave empty if there is none)</label>
          <input id="w_issue" name="issue">
        </div>
        <div class="full">
          <label for="w_action">Corrective action planned</label>
          <input id="w_action" name="correctiveAction" placeholder="Chlorination, pipe repair, re-testing">
        </div>
        <div>
          <label for="w_date">Date of observation</label>
          <input id="w_date" name="recordedOn" type="date">
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" onclick="closeDlg('waterDlg')">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script>
renderNav("water");

let records = [];
const rows = document.getElementById("rows");
const waterForm = document.getElementById("waterForm");

async function load() {
  const pending = document.getElementById("pendingOnly").checked;
  try {
    records = await http.get(API.sanitation + "/water" + (pending ? "?pending=true" : ""));
  } catch (e) {
    rows.innerHTML = '<tr><td colspan="8" class="empty">' + esc(e.message) + "</td></tr>";
    return;
  }
  const villageFilter = document.getElementById("villageFilter");
  const keep = villageFilter.value;
  const villages = [...new Set(records.map((r) => r.village).filter(Boolean))].sort();
  fillSelect(villageFilter, villages, (v) => v, (v) => v, "All villages");
  villageFilter.value = keep;
  render();
}

function render() {
  const village = document.getElementById("villageFilter").value;
  const list = records.filter((r) => !village || r.village === village);
  if (!list.length) {
    rows.innerHTML = '<tr><td colspan="8" class="empty">No water records found.</td></tr>';
    return;
  }
  rows.innerHTML = list.map((r) =>
    "<tr>" +
      "<td>" + fmtDate(r.recordedOn) + "</td>" +
      "<td><strong>" + esc(r.village) + '</strong><span class="sub">' + esc(r.source) + "</span></td>" +
      "<td>" + badge(r.qualityStatus) + "</td>" +
      '<td class="num">' + (r.phValue == null ? "-" : Number(r.phValue).toFixed(1)) + "</td>" +
      "<td>" + esc(r.observation) + "</td>" +
      "<td>" + (r.issue ? "<strong>" + esc(r.issue) + "</strong>" : "No issue") +
        (r.correctiveAction ? '<span class="sub">Action: ' + esc(r.correctiveAction) + "</span>" : "") + "</td>" +
      "<td>" + badge(r.actionStatus) + "</td>" +
      "<td>" + (r.actionStatus === "PENDING" ? '<button class="btn sm primary" onclick="markDone(' + r.id + ')">Mark action done</button>' : "") + "</td>" +
    "</tr>"
  ).join("");
}

function addRecord() {
  waterForm.reset();
  waterForm.elements.recordedOn.value = today();
  openDlg("waterDlg");
}

async function saveRecord(e) {
  e.preventDefault();
  try {
    await http.post(API.sanitation + "/water", formData(waterForm));
    closeDlg("waterDlg");
    toast("Observation saved.");
    load();
  } catch (err) { showError(err); }
}

async function markDone(id) {
  try {
    await http.put(API.sanitation + "/water/" + id + "/action-done");
    toast("Corrective action marked as done.");
    load();
  } catch (err) { showError(err); }
}

load();
</script>
</body>
</html>
